name: Publish release APK

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve an unpublished application version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TEMPLATE=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' mastodon/build.gradle | head -n 1)
          if [[ ! "$VERSION_TEMPLATE" =~ ^(.*\+fork\.)([0-9]+)(\.moshinda)$ ]]; then
            echo "Unsupported release version format: $VERSION_TEMPLATE" >&2
            exit 1
          fi

          PREFIX="${BASH_REMATCH[1]}"
          NUMBER="${BASH_REMATCH[2]}"
          SUFFIX="${BASH_REMATCH[3]}"
          while :; do
            VERSION="${PREFIX}${NUMBER}${SUFFIX}"
            TAG="v$VERSION"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            NUMBER=$((NUMBER + 1))
          done

          sed -i -E "s/^[[:space:]]*versionCode[[:space:]]+.*/\t\tversionCode $NUMBER/" mastodon/build.gradle
          sed -i -E "s|^[[:space:]]*versionName[[:space:]]+.*|\t\tversionName \"$VERSION\"|" mastodon/build.gradle
          echo "Publishing $VERSION (versionCode $NUMBER)"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore the release signing key
        env:
          EMOJIDON_RELEASE_KEYSTORE_BASE64: ${{ secrets.EMOJIDON_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$EMOJIDON_RELEASE_KEYSTORE_BASE64"
          mkdir -p mastodon/keystore
          echo "$EMOJIDON_RELEASE_KEYSTORE_BASE64" | base64 --decode > mastodon/keystore/e-mojidon-release.jks
          chmod 600 mastodon/keystore/e-mojidon-release.jks

      - name: Build signed release APK
        env:
          CURRENT_DATE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: unused
          SIGNING_KEY_ALIAS: unused
          SIGNING_KEY_PASSWORD: unused
          EMOJIDON_RELEASE_STORE_PASSWORD: ${{ secrets.EMOJIDON_RELEASE_STORE_PASSWORD }}
          EMOJIDON_RELEASE_KEY_ALIAS: ${{ secrets.EMOJIDON_RELEASE_KEY_ALIAS }}
          EMOJIDON_RELEASE_KEY_PASSWORD: ${{ secrets.EMOJIDON_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :mastodon:assembleRelease --console=plain

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          APK: mastodon/build/outputs/apk/release/e-mojidon-release.apk
        run: |
          gh release create "$TAG" "$APK#e-mojidon-$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "e-mojidon $VERSION" \
            --generate-notes
